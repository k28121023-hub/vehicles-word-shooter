<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>交通工具單字大射擊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overscroll-behavior: none;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .game-canvas {
            background: linear-gradient(to bottom, #1a202c, #2d3748);
            box-shadow: inset 0 0 20px #000;
        }
        /* Custom Scrollbar for the word panel if needed */
        .word-grid::-webkit-scrollbar {
            width: 6px;
        }
        .word-grid::-webkit-scrollbar-thumb {
            background-color: #4a5568;
            border-radius: 4px;
        }
        .btn-press {
            transition: transform 0.1s;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-900 h-screen w-screen flex flex-col overflow-hidden text-white select-none">

    <!-- Game Header -->
    <div class="flex justify-between items-center px-4 py-2 bg-gray-800 border-b border-gray-700 h-14 shrink-0">
        <div>
            <h1 class="text-lg font-bold text-yellow-400">🚗 交通工具大射擊</h1>
        </div>
        <div class="flex gap-4">
            <div class="text-right">
                <span class="text-xs text-gray-400">進度</span>
                <div id="progressDisplay" class="text-xl font-mono font-bold text-blue-400">0/12</div>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-400">分數</span>
                <div id="scoreDisplay" class="text-xl font-mono font-bold text-green-400">0</div>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-400">生命</span>
                <div id="livesDisplay" class="text-xl font-mono font-bold text-red-400">❤❤❤</div>
            </div>
        </div>
    </div>

    <!-- Canvas Area -->
    <div class="flex-grow relative flex justify-center items-center bg-gray-900 w-full overflow-hidden" id="canvasContainer">
        <canvas id="gameCanvas" class="game-canvas w-full h-full"></canvas>
        
        <!-- Start Screen Overlay -->
        <div id="startScreen" class="absolute inset-0 bg-black/80 flex flex-col justify-center items-center z-10">
            <h2 class="text-4xl font-bold mb-4 text-white">準備好了嗎？</h2>
            <p class="text-gray-300 mb-8 text-center px-4">
                左右滑動控制戰車<br>
                點擊下方單字發射對應子彈<br>
                <span class="text-yellow-400">收集滿 12 個交通工具單字即可過關！</span>
            </p>
            <button id="startBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-xl font-bold shadow-lg transform transition hover:scale-105">開始遊戲</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverScreen" class="hidden absolute inset-0 bg-red-900/95 flex flex-col justify-center items-center z-20">
            <h2 class="text-5xl font-bold mb-2 text-white">遊戲結束</h2>
            <p class="text-xl mb-6 text-gray-200">還差一點點！</p>
            <p class="text-2xl mb-6">最終分數: <span id="finalScore" class="font-mono text-yellow-300">0</span></p>
            <button id="restartBtn" class="px-8 py-3 bg-white text-red-900 rounded-lg text-xl font-bold shadow-lg transform transition hover:scale-105">再玩一次</button>
        </div>

        <!-- Win Screen Overlay -->
        <div id="winScreen" class="hidden absolute inset-0 bg-yellow-600/95 flex flex-col justify-center items-center z-20">
            <h2 class="text-5xl font-bold mb-2 text-white">🎉 闖關成功！</h2>
            <p class="text-xl mb-6 text-white">太棒了！所有的交通工具單字都學會了！</p>
            <p class="text-2xl mb-6 text-white">最終分數: <span id="winScore" class="font-mono text-yellow-100 font-bold">0</span></p>
            <button id="winRestartBtn" class="px-8 py-3 bg-white text-yellow-700 rounded-lg text-xl font-bold shadow-lg transform transition hover:scale-105">再挑戰一次</button>
        </div>
    </div>

    <!-- Word Control Panel (The "Ammo") -->
    <div class="h-1/4 bg-gray-800 border-t border-gray-600 p-2 shrink-0 flex flex-col">
        <div class="text-center text-xs text-gray-400 mb-1">點擊單字發射子彈 (Click Word to Fire)</div>
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-4 gap-2 h-full overflow-y-auto word-grid pb-2" id="wordButtons">
            <!-- Buttons generated by JS -->
        </div>
    </div>

    <script>
        // --- 遊戲資料 (修正後的 12 個單字) ---
        const VOCABULARY = [
            {
                        "word": "bus",
                        "img": "images/bus.png",
                        "emoji": "🚌",
                        "label": "公車"
            },
            {
                        "word": "train",
                        "img": "images/train.png",
                        "emoji": "🚆",
                        "label": "火車"
            },
            {
                        "word": "car",
                        "img": "images/car.png",
                        "emoji": "🚗",
                        "label": "汽車"
            },
            {
                        "word": "subway",
                        "img": "images/subway.png",
                        "emoji": "🚇",
                        "label": "地鐵"
            },
            {
                        "word": "scooter",
                        "img": "images/scooter.png",
                        "emoji": "🛵",
                        "label": "機車"
            },
            {
                        "word": "motorcycle",
                        "img": "images/motorcycle.png",
                        "emoji": "🏍️",
                        "label": "重型機車"
            },
            {
                        "word": "bicycle",
                        "img": "images/bicycle.png",
                        "emoji": "🚲",
                        "label": "腳踏車"
            },
            {
                        "word": "taxi",
                        "img": "images/taxi.png",
                        "emoji": "🚕",
                        "label": "計程車"
            },
            {
                        "word": "cable car",
                        "img": "images/cable-car.png",
                        "emoji": "🚡",
                        "label": "纜車"
            },
            {
                        "word": "ship",
                        "img": "images/ship.png",
                        "emoji": "🚢",
                        "label": "郵輪"
            },
            {
                        "word": "ferry",
                        "img": "images/ferry.png",
                        "emoji": "⛴️",
                        "label": "渡輪"
            },
            {
                        "word": "airplane",
                        "img": "images/airplane.png",
                        "emoji": "✈️",
                        "label": "飛機"
            }
];

        // --- 系統變數 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const scoreEl = document.getElementById('scoreDisplay');
        const livesEl = document.getElementById('livesDisplay');
        const progressEl = document.getElementById('progressDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const winScoreEl = document.getElementById('winScore');
        const wordGrid = document.getElementById('wordButtons');
        
        let gameState = 'START'; // START, PLAYING, GAMEOVER, WIN
        let score = 0;
        let lives = 3;
        let lastTime = 0;
        let spawnTimer = 0;
        let spawnInterval = 2000;
        let difficultyMultiplier = 1;
        
        // 追蹤已收集的單字
        let clearedWords = new Set();

        // --- 遊戲物件 ---
        const tank = {
            x: 0,
            y: 0,
            width: 50,
            height: 40,
            color: '#3b82f6',
            targetX: 0
        };

        let enemies = [];
        let bullets = [];
        let particles = [];
        
        // --- 初始化圖片載入 ---
        VOCABULARY.forEach(item => {
            const img = new Image();
            img.onload = () => { item.loadedImg = img; };
            img.onerror = () => { item.loadedImg = null; };
            img.src = item.img;
        });

        // --- 初始化 UI ---
        function initUI() {
            wordGrid.innerHTML = '';
            // 根據單字數量調整網格佈局
            wordGrid.className = `grid grid-cols-3 sm:grid-cols-4 gap-2 h-full overflow-y-auto word-grid pb-2`;

            VOCABULARY.forEach(item => {
                const btn = document.createElement('button');
                btn.id = `btn-${item.word.replace(/\s+/g, '-')}`; 
                btn.className = 'min-h-[44px] btn-press bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-1 rounded border border-gray-500 text-xs sm:text-sm flex flex-col items-center justify-center h-full transition-colors duration-300';
                btn.innerHTML = `<span class="text-yellow-300 leading-tight text-center break-words w-full">${item.word}</span><span class="text-[10px] text-gray-400 mt-0.5">${item.label}</span>`;
                
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    fireBullet(item.word);
                    btn.classList.add('bg-blue-600', 'border-blue-400');
                    setTimeout(() => btn.classList.remove('bg-blue-600', 'border-blue-400'), 150);
                });

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.click();
                }, {passive: false});

                wordGrid.appendChild(btn);
            });
        }

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            tank.y = canvas.height - 60;
            tank.x = canvas.width / 2;
            tank.targetX = canvas.width / 2;
        }
        window.addEventListener('resize', resize);

        // --- 遊戲核心邏輯 ---

        function startGame() {
            gameState = 'PLAYING';
            spawnTimer = 0;
            score = 0;
            lives = 3;
            difficultyMultiplier = 1;
            spawnInterval = 2500;
            enemies = [];
            bullets = [];
            particles = [];
            clearedWords.clear(); // 重置已收集單字
            
            updateScoreUI();
            updateProgressUI();
            
            // 重置按鈕顏色
            document.querySelectorAll('#wordButtons button').forEach(btn => {
                btn.classList.remove('opacity-50', 'bg-green-800');
                btn.classList.add('bg-gray-700');
            });

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            finalScoreEl.innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function gameWin() {
            gameState = 'WIN';
            winScoreEl.innerText = score;
            document.getElementById('winScreen').classList.remove('hidden');
            // 放個慶祝煙火
            for(let i=0; i<10; i++) {
                setTimeout(() => {
                    createExplosion(canvas.width/2 + (Math.random()-0.5)*300, canvas.height/2 + (Math.random()-0.5)*300, ['#FFD700', '#FFF', '#FFA500'][Math.floor(Math.random()*3)]);
                }, i * 200);
            }
        }

        function fireBullet(word) {
            if (gameState !== 'PLAYING') return;
            bullets.push({
                x: tank.x,
                y: tank.y - 20,
                word: word,
                width: 120,
                speed: 10,
                active: true
            });
        }

        function spawnEnemy() {
            // 策略：優先生成還沒收集到的單字
            const uncollected = VOCABULARY.filter(v => !clearedWords.has(v.word));
            
            // 如果還有未收集的，優先從這裡面挑；否則隨機挑（雖然理論上收集完就贏了，但防呆）
            const pool = uncollected.length > 0 ? uncollected : VOCABULARY;
            
            const item = pool[Math.floor(Math.random() * pool.length)];
            const size = 80;
            const x = Math.random() * (canvas.width - size - 20) + size/2 + 10; 
            
            enemies.push({
                x: x,
                y: -80,
                size: size,
                word: item.word,
                emoji: item.emoji,
                img: item.loadedImg,
                speed: 1.0 * difficultyMultiplier, 
                rotation: 0 
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function update(dt) {
            if (gameState !== 'PLAYING') {
                // 就算結束了也要更新粒子效果，比較好看
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                });
                particles = particles.filter(p => p.life > 0);
                return;
            }

            // 1. 難度調整
            difficultyMultiplier = 1 + (score / 1000); 
            if (spawnInterval > 1000) spawnInterval = 2500 - (score * 5);

            // 2. 戰車移動
            tank.x += (tank.targetX - tank.x) * 0.2;
            if (tank.x < tank.width/2) tank.x = tank.width/2;
            if (tank.x > canvas.width - tank.width/2) tank.x = canvas.width - tank.width/2;

            // 3. 生成敵人
            spawnTimer += dt;
            if (spawnTimer > spawnInterval) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // 4. 更新子彈
            bullets.forEach(b => {
                b.y -= b.speed;
                if (b.y < -50) b.active = false;
            });

            // 5. 更新敵人 & 碰撞檢測
            enemies.forEach(e => {
                if (e.active === false) return;
                e.y += e.speed;

                // 檢測是否撞到戰車
                const dx = e.x - tank.x;
                const dy = e.y - tank.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < (e.size/2 + tank.width/2 - 10)) {
                    createExplosion(tank.x, tank.y, '#ef4444');
                    lives--;
                    updateScoreUI();
                    e.active = false;
                    if (lives <= 0) gameOver();
                }

                // 檢測子彈命中
                bullets.forEach(b => {
                    if (!b.active || e.active === false) return;
                    
                    if (Math.abs(b.x - e.x) < (e.size + 20) && Math.abs(b.y - e.y) < e.size) {
                        if (b.word === e.word) {
                            // 命中正確！
                            score += 10;
                            
                            // 記錄收集到的單字
                            if (!clearedWords.has(e.word)) {
                                clearedWords.add(e.word);
                                // 視覺效果：將對應的按鈕變綠色，表示已完成
                                const btnId = `btn-${e.word.replace(/\s+/g, '-')}`;
                                const btn = document.getElementById(btnId);
                                if(btn) {
                                    btn.classList.remove('bg-gray-700');
                                    btn.classList.add('bg-green-800');
                                }
                            }

                            updateScoreUI();
                            updateProgressUI();
                            createExplosion(e.x, e.y, '#fbbf24');
                            
                            e.active = false;
                            b.active = false;

                            // 檢查是否獲勝 (收集滿 12 個)
                            if (clearedWords.size >= VOCABULARY.length) {
                                setTimeout(gameWin, 500); // 稍微延遲一下讓玩家看到最後一個爆炸
                            }

                        } else {
                            // 命中錯誤，子彈消失但敵人不消失
                            b.active = false;
                        }
                    }
                });

                if (e.y > canvas.height + 50) {
                    e.active = false;
                }
            });

            bullets = bullets.filter(b => b.active);
            enemies = enemies.filter(e => e.active !== false);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 網格背景
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            // 戰車
            ctx.save();
            ctx.translate(tank.x, tank.y);
            ctx.fillStyle = tank.color;
            ctx.beginPath();
            ctx.moveTo(-20, 20); ctx.lineTo(20, 20); ctx.lineTo(15, -10); ctx.lineTo(-15, -10);
            ctx.fill();
            ctx.fillStyle = '#60a5fa'; ctx.fillRect(-5, -30, 10, 25);
            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(-25, 10, 10, 15); ctx.fillRect(15, 10, 10, 15);
            ctx.restore();

            // 子彈
            ctx.font = 'bold 22px Arial'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            bullets.forEach(b => {
                ctx.fillStyle = '#fcd34d';
                ctx.fillText(b.word, b.x, b.y);
                ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 10;
                ctx.fillRect(b.x - 2, b.y + 12, 4, 12); ctx.shadowBlur = 0;
            });

            // 敵人
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                
                // 如果是已收集的單字，給它一個特殊的金色邊框提示
                if (clearedWords.has(e.word)) {
                    ctx.strokeStyle = '#fbbf24'; // Gold
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 15;
                } else {
                    ctx.strokeStyle = '#fff';
                    ctx.shadowBlur = 0;
                }
                
                ctx.lineWidth = 3; 
                ctx.strokeRect(-e.size/2, -e.size/2, e.size, e.size);
                
                if (e.img) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);
                    const scale = e.size / Math.max(e.img.naturalWidth, e.img.naturalHeight);
                    const width = e.img.naturalWidth * scale;
                    const height = e.img.naturalHeight * scale;
                    ctx.drawImage(e.img, -width/2, -height/2, width, height);
                } else {
                    ctx.fillStyle = '#000000aa';
                    ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);
                    ctx.font = '45px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(e.emoji, 0, 0);
                }
                ctx.restore();
            });

            // 粒子
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            update(dt);
            draw();
            if (gameState === 'PLAYING' || particles.length > 0) {
                requestAnimationFrame(gameLoop);
            }
        }

        function updateScoreUI() {
            scoreEl.innerText = score;
            let livesStr = '';
            for(let i=0; i<lives; i++) livesStr += '❤';
            livesEl.innerText = livesStr;
        }

        function updateProgressUI() {
            progressEl.innerText = `${clearedWords.size}/${VOCABULARY.length}`;
        }

        // --- 輸入控制 ---
        function handleInput(clientX) {
            const rect = canvas.getBoundingClientRect();
            let x = clientX - rect.left;
            tank.targetX = x;
        }

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, {passive: false});

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('winRestartBtn').addEventListener('click', startGame);

        // --- 啟動 ---
        initUI();
        resize();
        
        ctx.fillStyle = '#1a202c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
